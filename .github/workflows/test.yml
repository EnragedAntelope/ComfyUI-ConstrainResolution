name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # comfy_api is mocked in conftest.py, so a full ComfyUI install isn't needed.
        # numpy silences torch's "Failed to initialize NumPy" import warning.
        run: python -m pip install --upgrade pip pytest torch numpy
      - name: Run tests
        run: python -m pytest -q
